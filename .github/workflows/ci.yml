name: TERRA NOVA CI
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Syntaxe et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe et lancer les tests
        run: npm run check
      - name: Vérifier les scripts shell
        run: bash -n scripts/build-etopo-overview.sh