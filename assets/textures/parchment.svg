<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
<defs>
  <filter id="paper-grain" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="4" seed="41" stitchTiles="stitch"/>
    <feColorMatrix values=".78 0 0 0 .08 .65 0 0 0 .05 .42 0 0 0 .02 0 0 0 .42 0"/>
  </filter>
  <filter id="fibres" x="-10%" y="-10%" width="120%" height="120%">
