    <stop offset=".42" stop-color="#614326" stop-opacity=".25"/>
    <stop offset="1" stop-color="#614326" stop-opacity="0"/>
  </radialGradient>
  <filter id="soften"><feGaussianBlur stdDeviation="13"/></filter>
