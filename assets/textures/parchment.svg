    <feColorMatrix values=".8 0 0 0 .08 .63 0 0 0 .045 .38 0 0 0 .015 0 0 0 .27 0"/>
  </filter>
  <radialGradient id="patina">
    <stop offset="0" stop-color="#c7a875" stop-opacity="0"/>
    <stop offset=".52" stop-color="#9c794c" stop-opacity=".10"/>
    <stop offset=".78" stop-color="#69492b" stop-opacity=".34"/>
    <stop offset=".94" stop-color="#49301d" stop-opacity=".66"/>
    <stop offset="1" stop-color="#24170f" stop-opacity=".82"/>
