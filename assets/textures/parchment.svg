<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
<defs>
  <filter id="paper-grain" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="4" seed="23" stitchTiles="stitch"/>
    <feColorMatrix values=".72 0 0 0 .16 .62 0 0 0 .12 .42 0 0 0 .06 0 0 0 .24 0"/>
  </filter>
  <filter id="fibres" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".018 .31" numOctaves="2" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values=".7 0 0 0 .12 .58 0 0 0 .09 .36 0 0 0 .04 0 0 0 .13 0"/>
  </filter>
  <radialGradient id="patina">
    <stop offset="0" stop-color="#f0dfb9" stop-opacity=".04"/>
    <stop offset=".68" stop-color="#b18b55" stop-opacity=".08"/>
    <stop offset=".91" stop-color="#8b6339" stop-opacity=".23"/>
    <stop offset="1" stop-color="#53371f" stop-opacity=".46"/>
  </radialGradient>
  <radialGradient id="stains">
    <stop stop-color="#8d633b" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8d633b" stop-opacity="0"/>
  </radialGradient>
  <filter id="soften"><feGaussianBlur stdDeviation="19"/></filter>
</defs>
<rect width="768" height="768" fill="#d8c49b"/>
<rect width="768" height="768" filter="url(#paper-grain)" opacity=".38"/>
<rect width="768" height="768" filter="url(#fibres)" opacity=".22"/>
<rect width="768" height="768" fill="url(#patina)"/>
<g filter="url(#soften)" opacity=".55">
  <ellipse cx="64" cy="138" rx="90" ry="43" fill="url(#stains)"/>
  <ellipse cx="696" cy="618" rx="105" ry="54" fill="url(#stains)"/>
  <ellipse cx="430" cy="24" rx="125" ry="34" fill="url(#stains)"/>
  <ellipse cx="22" cy="690" rx="72" ry="90" fill="url(#stains)"/>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M34 212 Q92 198 148 205 M580 92 Q634 80 710 99 M72 584 Q121 573 178 582 M486 720 Q552 706 620 718" stroke="#f7e8c7" stroke-opacity=".22" stroke-width="1.4"/>
  <path d="M112 356 Q168 348 207 354 M520 438 Q586 425 648 437 M282 42 Q331 35 375 43" stroke="#80603a" stroke-opacity=".12" stroke-width=".8"/>
